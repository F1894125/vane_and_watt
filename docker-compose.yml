services:
  vane_and_watt_db:
    image: postgres:15-alpine
    container_name: vane_and_watt_pg
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"  # Native Postgres is on port 5432, so we use 5433
    networks:
      - vane_and_watt_network
    volumes:
      - vane_and_watt_pg_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  vane_and_watt_redis:
    image: redis:7.2.4
    container_name: vane_and_watt_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - vane_and_watt_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vane_and_watt_app:
    build: .
    container_name: vane_and_watt_app
    restart: always
    gpus: all
    env_file:
      - ./.env
    depends_on:
      vane_and_watt_db:
        condition: service_healthy
      vane_and_watt_redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - vane_and_watt_network

  celery_worker:
    build: .
    container_name: vane_and_watt_celery
    restart: always
    gpus: all
    env_file:
      - ./.env
    command: celery -A config worker --loglevel=info -P solo
    depends_on:
      vane_and_watt_db:
        condition: service_healthy
      vane_and_watt_redis:
        condition: service_healthy
    networks:
      - vane_and_watt_network

networks:
  vane_and_watt_network:
    driver: bridge

volumes:
  vane_and_watt_pg_volume: