{% extends "base.html" %}
{% load static %}


{% block title %}
    Log In
{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-2">Log In</h2>
                    <p class="text-center text-muted mb-4 small">
                        Don't have an account? <a href="{% url 'account:register' %}" class="text-decoration-none">Sign up here</a>.
                    </p>
                    
                    <form id="login-form" data-login-url="{% url 'account:login' %}" data-dashboard-url="{% url 'account:dashboard' %}">
                        <!-- No CSRF because submission is done by AJAX -->
                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
                            {{ form.username }}
                        </div>
                        <div class="mb-4">
                            <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                            {{ form.password }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Log In</button>
                    </form>

                    <div id="login-error" class="alert alert-danger mt-3" role="alert" style="display: none;"></div>
                    
                    <hr class="my-4">
                </div>
            </div>
        </div>
    </div>

    <script src="{% static "account/js/login.js" %}"></script>
{% endblock content %}
